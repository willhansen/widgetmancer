[package]
name = "game"
version = "0.0.0"
edition.workspace = true

# Explicit bin list so snapshot_tool can be feature-gated. Keep autobins off to
# avoid duplicate-target warnings with the entries below.
autobins = false

[[bin]]
name = "game"
path = "src/main.rs"

[[bin]]
name = "portal_playground"
path = "src/bin/portal_playground.rs"

[[bin]]
name = "map_diagram"
path = "src/bin/map_diagram.rs"

[[bin]]
name = "snapshot_tool"
path = "src/bin/snapshot_tool.rs"
required-features = ["debug-tools"]

[features]
default = []
# Headless snapshot render/diff tooling (W.F) and the introspection helpers it
# shares with later W.B/W.C work. Off by default; no release-surface change.
debug-tools = []

[dependencies]
# external
approx = "0.5.1"
derive_more = "0.99.17"
dyn-clone = "1.0.9"
enum-as-inner = "0.5.1"
euclid = "0.22.7"
line_drawing = "1.0"
ntest = "0.9.0"
num = "0.4"
ordered-float = "3.3.0"
rand = "0.8.4"
rgb = "0.8.34"
strum = "0.24"
strum_macros = "0.24"
termion = "2.0.1"
priority-queue = "1.2.3"
itertools = "0.10.5"
unordered-pair = "0.2.4"
shrinkwraprs = "0.3.0"
getset = "0.1.2"
backtrace-on-stack-overflow = "0.3.0"
ambassador = "0.3.5"


utility.workspace = true
terminal_rendering.workspace = true
stdext = "0.3.3"
regex = "1.11.1"
color-hex = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[dev-dependencies]
pretty_assertions = "1.3.0"
